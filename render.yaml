services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service (Docker Deployment)
  # -------------------------------------------------------------
  - type: web
    name: uniguide-ai-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: uniguide
      - key: LLM_MODEL_NAME
        value: gemini-1.5-flash
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"

  # -------------------------------------------------------------
  # 2. React Frontend (Static Site)
  # -------------------------------------------------------------
  - type: static
    name: uniguide-ai-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to https://uniguide-ai-backend.onrender.com/api/v1 in Render dashboard
